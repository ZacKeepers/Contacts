<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portfolio - Zachary Keepers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <main class="content-page project-page">
        <button id="theme-toggle" aria-label="Toggle light and dark mode">
            <i class="fas fa-moon"></i>
        </button>
        <a class="back-link" href="index.html">← Back to Contact Information</a>
        <h1>Project Portfolio</h1>
        <p class="project-intro">Explore a collection of my projects. Select a project to learn more about the design process, challenges, and final result.</p>

        <section class="project-grid" aria-label="Projects">
            <!-- Duplicate a project card to add another project to the collection. -->
            <a class="project-card" href="project-websites/Tusk Battlebot.html">
                <div class="project-image" style="--project-image: url('project-photos/Tusk Bot Photo.png');">
                </div>
                <h2><strong>"Tusk"</strong> : A 3lb Combat Robot</h2>
            </a>

            <a class="project-card" href="project-websites/24331 Cypher.html">
                <div class="project-image" style="--project-image: url('project-photos/Cypher Photo.jpg');">
                </div>
                <h2>FTC 24331 25-26 Worlds Competition Robot</h2>
            </a>

            <a class="project-card" href="project-websites/10101 Waka-Waka.html">
                <div class="project-image" style="--project-image: url('project-photos/Waka-Waka Photo.jpg');">
                </div>
                <h2>FRC 10101 25-26 Worlds Competition Robot</h2>
            </a>
        </section>
    </main>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        function setTheme(theme) {
            body.classList.toggle('dark-mode', theme === 'dark');
            themeToggle.querySelector('i').className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            setTheme('dark');
        } else {
            setTheme('light');
        }

        themeToggle.addEventListener('click', () => {
            const nextTheme = body.classList.contains('dark-mode') ? 'light' : 'dark';
            setTheme(nextTheme);
            localStorage.setItem('theme', nextTheme);
        });
    </script>
</body>
</html>
